<style>
:root{
  --ground:#F1F3F2; --surface:#FFFFFF; --surface-2:#F7F8F7; --line:#DCE1DF; --line-2:#E9ECEA;
  --ink:#151D1A; --ink-2:#48534E; --ink-3:#77837D;
  --brand:#3E2A5C; --brand-2:#54397A; --brand-ink:#EDE7F5;
  --accent:#C9740A;
  --ok:#17794B; --warn:#B9761B; --crit:#B42318; --idle:#6E7A86;
  --ok-bg:#E4F2EA; --warn-bg:#FBF0DF; --crit-bg:#FBE9E7; --idle-bg:#ECEFF1;
  --c1:#2D5FA8; --c2:#C9740A; --c3:#1E8A6E; --c4:#8A4FBF; --c5:#B4436C; --c6:#0480A8; --c7:#8A6D12;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 18px rgba(20,30,25,.05);
  --r:10px;
}

  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16.5px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,.disp{font-family:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.sidebar{position:fixed;inset:0 auto 0 0;width:262px;z-index:40;
  background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  transition:width .18s ease, transform .22s ease;overflow:hidden}
.shell.collapsed .sidebar{width:62px}
.brandrow{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.mark{width:32px;height:32px;flex:0 0 32px;border-radius:8px;background:linear-gradient(140deg,var(--accent),#8E5A12);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;font-family:"Bai Jamjuree",sans-serif}
.brandtxt{min-width:0}
.brandtxt b{display:block;font-family:"Bai Jamjuree",sans-serif;font-size:14px;letter-spacing:.2px;white-space:nowrap}
.brandtxt span{display:block;font-size:11px;opacity:.72;white-space:nowrap}
.shell.collapsed .brandtxt,.shell.collapsed .navlabel,.shell.collapsed .sidefoot{display:none}
nav{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--brand-ink);cursor:pointer;text-align:left;font-size:15.5px}
.navbtn:hover{background:rgba(255,255,255,.08)}
.navbtn[aria-current="true"]{background:rgba(255,255,255,.14);font-weight:600}
.navbtn svg{flex:0 0 19px;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbadge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;padding:0 6px;border-radius:9px;font-weight:600}
.sidefoot{margin-top:auto;font-size:11.5px;opacity:.65;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.12)}
.collapse{margin-top:8px;border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--brand-ink);
  border-radius:8px;padding:7px;cursor:pointer;font-size:12.5px}
.scrim{display:none}

main{flex:1;min-width:0;margin-left:262px;transition:margin-left .18s ease}
.shell.collapsed main{margin-left:62px}
.wrap{padding:0 20px 56px;max-width:1180px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);
  padding:16px 20px 12px;border-bottom:1px solid var(--line);margin-bottom:18px;
  display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
header.top h1{font-size:23px;letter-spacing:-.2px}
header.top p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.menubtn{display:none}

/* ---------- atoms ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 15px;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-bg)} .p-warn{color:var(--warn);background:var(--warn-bg)}
.p-crit{color:var(--crit);background:var(--crit-bg)} .p-idle{color:var(--idle);background:var(--idle-bg)}
label.f{display:block;font-size:14px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
label.f span{color:var(--crit)}
.in{width:100%;padding:11px 13px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.in:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--surface)}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.err{font-size:12px;color:var(--crit);margin-top:4px}
.tablewrap{overflow-x:auto;border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:760px}
th{text-align:left;font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.tile .k{font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.tile .v{font-family:"Bai Jamjuree",sans-serif;font-size:31px;font-weight:600;line-height:1.15;letter-spacing:-.5px}
.tile .s{font-size:11.5px;color:var(--ink-3)}
.bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:18.5px}
.sec .note{font-size:12px;color:var(--ink-3)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* stepper */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px}
.step b{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.step.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.step.done{border-color:var(--ok);color:var(--ink-2)}

/* photos */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.shot{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.shot button{position:absolute;top:5px;right:5px;border:0;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;
  width:24px;height:24px;cursor:pointer;line-height:1}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;background:var(--surface-2)}
.geo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:8px}
.geo code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:2px 7px;border-radius:6px}

/* charts */
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 12px;box-shadow:var(--shadow)}
.chartcard h3{font-size:14.5px;margin-bottom:2px}
.chartcard .sub{font-size:12px;color:var(--ink-3);margin-bottom:12px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:"IBM Plex Sans Thai",sans-serif;font-variant-numeric:tabular-nums}
.axis{fill:var(--ink-3);font-size:11px}
.vlab{fill:var(--ink-2);font-size:11.5px;font-weight:600}
.gridline{stroke:var(--line-2);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--ground);padding:7px 10px;
  border-radius:7px;font-size:12px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:230px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(10,14,12,.68);display:grid;place-items:center;padding:18px}
.modal .box{background:var(--surface);border-radius:12px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:18px}

@media (max-width:860px){
  .sidebar{transform:translateX(-100%);width:262px}
  .shell.navopen .sidebar{transform:none}
  .shell.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:30}
  main,.shell.collapsed main{margin-left:0}
  .menubtn{display:inline-flex}
  .collapse{display:none}
  .wrap{padding:0 16px 48px}
  header.top{padding:14px 16px 11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ---------- ปรับขนาดตัวหนังสือ + แถบสี ---------- */
:root{--fs:1}
header.top,.wrap{zoom:var(--fs,1)}
.rainbow{height:6px;border-radius:99px;margin:0 0 14px;
  background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6),var(--c7))}
.fsctl{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);overflow:hidden}
.fsctl button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:15px;font-weight:700;line-height:1}
.fsctl button:hover{background:var(--surface-2)}
.fsctl span{font-size:12px;color:var(--ink-3);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.tile{border-top:4px solid var(--stripe,var(--accent))}
.sec h2{position:relative;padding-left:13px}
.sec h2::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:5px;border-radius:99px;background:var(--accent)}
.card.stripe,.chartcard{border-left:4px solid var(--stripe,var(--line))}

/* ---------- extras ---------- */
.authbar{background:var(--crit-bg);border:1px solid var(--crit);border-left-width:4px;border-radius:var(--r);
  padding:12px 14px;margin-bottom:16px;font-size:13.5px;line-height:1.5}
.authbar b{color:var(--crit);display:block;font-size:14.5px;margin-bottom:4px}
.authbar ol{margin:7px 0 0;padding-left:20px} .authbar li{margin:3px 0}
.noproof{display:inline-block;font-size:10.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);
  border:1px dashed var(--warn);border-radius:999px;padding:0 7px;white-space:nowrap;vertical-align:1px}
.pill.unproven{border:1px dashed currentColor}
.pill.unproven::after{content:"*";font-weight:700;margin-left:1px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:600;cursor:pointer;text-align:left;
  border-bottom:1px dotted var(--ink-3)}
.linkbtn:hover{color:var(--accent);border-bottom-color:var(--accent)}
.danger{color:var(--crit);border-color:var(--crit)}
.danger:hover{background:var(--crit-bg)}
tr.gone td{opacity:.62}
tr.gone td b{text-decoration:line-through}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--line)}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink-3)}
.tl li.ok::before{border-color:var(--ok)} .tl li.warn::before{border-color:var(--warn)}
.tl li.crit::before{border-color:var(--crit)} .tl li.gone::before{border-color:var(--line);background:var(--line-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px 18px;font-size:13.5px}
.kv .k{font-size:11.5px;color:var(--ink-3)}
.rep{background:var(--surface);color:var(--ink)}
.rep h2{font-size:15px;margin:22px 0 8px}
.rep table{min-width:0;font-size:12px}
.rep th,.rep td{padding:5px 7px}
/* ---------- แผ่นกำหนดการ A4 แนวนอน ---------- */
.sheet{background:#fff;color:#14181B;border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow);overflow-x:auto}
.sheet .inner{min-width:900px}
.sheet h2{font-size:17px;margin:0;color:#14181B}
.sheet .sub{font-size:11.5px;color:#5A6570;margin-top:1px}
.sheet .shead{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid #3E2A5C;padding-bottom:5px;margin-bottom:6px;flex-wrap:wrap}
.sheet .kpis{margin-left:auto;display:flex;gap:6px}
.sheet .kpi{border:1px solid #CBD3D8;border-radius:4px;padding:2px 8px;text-align:center;min-width:64px}
.sheet .kpi .k{font-size:9px;color:#5A6570;white-space:nowrap}
.sheet .kpi .v{font-size:16px;font-weight:700;line-height:1.15}
.sheet .kpi.g .v{color:#17794B} .sheet .kpi.c .v{color:#B42318} .sheet .kpi.w .v{color:#B9761B}
.sheet table{border-collapse:collapse;width:100%;min-width:0;font-size:12px}
.sheet th{background:#3E2A5C;color:#fff;font-size:10px;font-weight:700;padding:4px 5px;text-align:left;
  border-right:1px solid #5A4478;position:static;text-transform:none;letter-spacing:0}
.sheet th:last-child{border-right:0}
.sheet td{padding:1px 5px;border-bottom:1px solid #E6EAEC;font-size:12px;line-height:1.2;color:#14181B}
.sheet tr.band td{border-top:1px solid #B6BEC5}
.sheet tbody tr:hover{background:#F6F7F8}
.sheet .n{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.sheet .b{font-weight:700} .sheet .nm{font-weight:600}
.sheet .ac{text-align:center;font-weight:700;color:#17794B}
.sheet .stx{white-space:nowrap;font-size:11px;font-weight:600;text-align:center}
.sheet .stx.ok{color:#17794B} .sheet .stx.crit{color:#B42318}
.sheet .stx.warn{color:#B9761B} .sheet .stx.plan{color:#41566B}
.sheet .axcell{position:relative;height:14px;background:#F4F5F7}
.sheet .axcell span{position:absolute;transform:translateX(-50%);top:1px;font-size:9.5px;color:#5A6570;white-space:nowrap}
.sheet .axcell i{position:absolute;top:11px;height:3px;width:0;border-left:1px solid #B6BEC5}
.sheet .gcell{padding:2px 0;width:36%}
.sheet .track{position:relative;height:9px;background:#EFF1F3;border-radius:3px}
.sheet .gbar{position:absolute;top:0;height:9px;border-radius:3px}
.sheet .gbar.ok{background:#17794B} .sheet .gbar.crit{background:#B42318}
.sheet .gbar.warn{background:#B9761B} .sheet .gbar.plan{background:#2D5FA8}
.sheet .gd{position:absolute;top:-1px;width:5px;height:11px;margin-left:-2.5px;border-radius:1px}
.sheet .gd.r{background:#14181B}
.sheet .gd.d{background:#fff;border:2px solid #14181B}
.sheet .gd.d.crit{border-color:#B42318} .sheet .gd.d.ok{border-color:#17794B}
.sheet .gnow{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1px dashed #B42318}

function siteStatus(site){
  const st={...site.base};
  live().filter(r=>r.siteSeq===site.seq).sort((a,b)=>a.ts-b.ts)
    .forEach(r=>{ st[r.stage] = r.status==="done"?1 : r.status==="progress"?0.5 : r.status==="issue"?-1 : 0; });
  return st;
}

function evidenceOf(site){
  const e={};
  live().filter(r=>r.siteSeq===site.seq).forEach(r=>{ if((r.photos||[]).length) e[r.stage]=true; });
  return e;
}
/* ขั้นตอนที่บังคับต้องมีหลักฐาน (รูปถ่าย + พิกัด) = ติดตั้งแผง/อินเวอร์เตอร์ เท่านั้น */

function noProofCount(){
  let n=0;
  SITES.forEach(s=>{const st=siteStatus(s),e=evidenceOf(s);
    PROOF_STAGES.forEach(k=>{ if(st[k]===1 && !e[k]) n++; });});
  return n;
}

function proofMark(stage,done,hasProof){

  state.view=k;
  if(k==="site") state.siteSel=arg;
  ALLVIEWS.forEach(n=>{$("#v-"+n).hidden=(n!==k);});
  const v=VIEWS.find(x=>x.k===k)||{n:"รายละเอียดสถานที่",sub:"ประวัติการแจ้งสถานะและรูปถ่ายทั้งหมดของจุดติดตั้งนี้"};
  $("#vtitle").textContent=v.n; $("#vsub").textContent=v.sub;
  $$("#nav .navbtn").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v===k)));
  $("#shell").classList.remove("navopen");
  window.scrollTo({top:0,behavior:"instant"});
  render();
}

/* =======================================================================  OVERVIEW  */
function renderOverview(){
  const rows=SITES.map(s=>({s,st:siteStatus(s)}));
  const doneMain=rows.filter(r=>r.st.main===1).length;
  const doneClose=rows.filter(r=>r.st.close===1).length;
  const issues=rows.filter(r=>Object.values(r.st).some(v=>v===-1));
  const pvDone=rows.filter(r=>r.st.main===1).reduce((a,r)=>a+r.s.pv,0);
  const kwDone=rows.filter(r=>r.st.main===1).reduce((a,r)=>a+r.s.kwp,0);
  const urgent=rows.filter(r=>r.st.main!==1).map(r=>({...r,d:daysTo(r.s.due)})).sort((a,b)=>a.d-b.d);
  const overdue=urgent.filter(r=>r.d<0).length;

  const tiles=`<div class="tiles">
    <div class="tile" style="--stripe:var(--c4)"><div class="k">☀️ ติดตั้งแผงแล้วเสร็จ</div>
      <div class="v num">${doneMain}<span style="font-size:15px;color:var(--ink-3)"> / 36</span></div>
      <div class="bar"><i style="width:${doneMain/36*100}%"></i></div>
      <div class="s num">${(doneMain/36*100).toFixed(0)}% ของแผน</div></div>
    <div class="tile" style="--stripe:var(--c6)"><div class="k">✅ ปิดงานแล้ว</div>
      <div class="v num">${doneClose}<span style="font-size:15px;color:var(--ink-3)"> / 36</span></div>
      <div class="bar"><i style="width:${doneClose/36*100}%;background:var(--c6)"></i></div>
      <div class="s">ปิดงานจัดซื้อ/งานติดตั้งครบถ้วน</div></div>
    <div class="tile" style="--stripe:var(--crit)"><div class="k">⏰ เลยกำหนดแล้วเสร็จ</div>
      <div class="v num" style="color:${overdue?'var(--crit)':'var(--ok)'}">${overdue}</div>
      <div class="s">แห่งที่ครบกำหนดแล้วแต่ยังไม่ติดตั้ง</div></div>
    <div class="tile" style="--stripe:var(--warn)"><div class="k">⚠️ แจ้งปัญหาค้างอยู่</div>
      <div class="v num" style="color:${issues.length?'var(--warn)':'var(--ink)'}">${issues.length}</div>
      <div class="s">แห่งที่มีขั้นตอนติดสถานะปัญหา</div></div>
    <div class="tile" style="--stripe:var(--c3)"><div class="k">⚡ กำลังผลิตที่ติดตั้งแล้ว</div>
      <div class="v num">${kwDone}<span style="font-size:15px;color:var(--ink-3)"> kWp</span></div>
      <div class="s num">จาก 344 kWp · ${nf(pvDone)} แผง</div></div>
  </div>`;

  const stageBars=STAGES.map(g=>{
    const d=rows.filter(r=>r.st[g.k]===1).length, p=rows.filter(r=>r.st[g.k]===0.5).length, x=rows.filter(r=>r.st[g.k]===-1).length;
    return `<div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)">
      <div style="font-size:13.5px">${g.n}</div>
      <div class="num" style="font-size:13px;color:var(--ink-3)">${d}/36 แล้วเสร็จ${p?` · ${p} กำลังทำ`:""}${x?` · ${x} ปัญหา`:""}</div>
      <div class="bar" style="grid-column:1/-1;height:9px">
        <i style="width:${d/36*100}%;background:${g.c}"></i></div></div>`;
  }).join("");

  const urg=urgent.slice(0,8).map(r=>{
    const cls=r.d<0?"p-crit":r.d<=7?"p-warn":"p-idle";
    const txt=r.d<0?`เลยกำหนด ${-r.d} วัน`:r.d===0?"ครบกำหนดวันนี้":`เหลือ ${r.d} วัน`;
    return `<tr><td><button class="linkbtn" data-site="${r.s.seq}">${esc(r.s.name)}</button><div style="font-size:12px;color:var(--ink-3)">${esc(r.s.prov)} · เที่ยวที่ ${r.s.trip}</div></td>
      <td class="num">${fdate(r.s.due)}</td><td><span class="pill ${cls}">${txt}</span></td>
      <td>${(()=>{const[c,t]=lvlPill(r.st.accy);return `<span class="pill ${c}">${t}</span>`;})()}</td>
      <td><button class="btn" data-quick="${r.s.seq}">แจ้งสถานะ</button></td></tr>`;
  }).join("");

  $("#v-overview").innerHTML = tiles + `
  <div class="sec"><h2>ความคืบหน้าตามขั้นตอนงาน</h2><span class="note">อัปเดตจากการแจ้งหน้างานแบบเรียลไทม์</span></div>
  <div class="card pad">${stageBars}</div>
  <div class="sec"><h2>🔥 ต้องเร่งดำเนินการ</h2><span class="note">เรียงตามวันครบกำหนดที่ใกล้ที่สุด · แสดง 8 อันดับแรก</span></div>
  <div class="card tablewrap"><table><thead><tr><th>การไฟฟ้า / สถานที่</th><th>ครบกำหนด</th><th>สถานะเวลา</th><th>อุปกรณ์ประกอบ</th><th></th></tr></thead>
  <tbody>${urg||`<tr><td colspan="5" class="empty">ติดตั้งครบทุกแห่งแล้ว</td></tr>`}</tbody></table></div>
  <div class="sec"><h2>📋 รายการทั้งหมด 36 แห่ง</h2><span class="note">เก็บหลักฐานรูปถ่าย + พิกัด เฉพาะขั้น “ติดตั้งแผง/อินเวอร์เตอร์” ${noProofCount()?`&mdash; <span class="noproof">${noProofCount()} แห่งยังไม่มีหลักฐาน</span> (ป้ายเส้นประ + เครื่องหมาย *)`:"&mdash; ทุกแห่งที่ติดตั้งแผงแล้วเสร็จ มีรูปถ่ายยืนยันครบ"}</span></div>
  ${filterBar()}
  <div class="card tablewrap" id="alltbl"></div>`;

  $$("#v-overview [data-quick]").forEach(b=>b.onclick=()=>{state.form.siteSeq=b.dataset.quick;state.form.step=1;go("report");});
  wireFilter(); renderAllTable(); wireSiteLinks("#v-overview");
}
function filterBar(){
  const provs=[...new Set(SITES.map(s=>s.prov))];
  return `<div class="chips" id="fbar">
    <button class="chip" data-f="prov" data-v="all" aria-pressed="${state.filt.prov==="all"}">ทุกจังหวัด</button>
    ${provs.map(p=>`<button class="chip" data-f="prov" data-v="${p}" aria-pressed="${state.filt.prov===p}">${p}</button>`).join("")}
    <input class="in" id="fq" placeholder="ค้นหาชื่อสถานที่ / WBS" value="${esc(state.filt.q)}" style="max-width:250px;margin-left:auto">
  </div>`;
}
function wireFilter(){
  $$("#fbar .chip").forEach(c=>c.onclick=()=>{state.filt.prov=c.dataset.v;renderOverview();});
  const q=$("#fq"); if(q){q.oninput=()=>{state.filt.q=q.value;renderAllTable();};}
}
function renderAllTable(){
  const q=state.filt.q.trim().toLowerCase();
  const rows=SITES.filter(s=>(state.filt.prov==="all"||s.prov===state.filt.prov)&&
      (!q||s.name.toLowerCase().includes(q)||s.wbs.toLowerCase().includes(q)))
    .map(s=>{const st=siteStatus(s);const d=daysTo(s.due);
      const timeCls=st.main===1?"p-ok":d<0?"p-crit":d<=7?"p-warn":"p-idle";
      const timeTxt=st.main===1?"เสร็จแล้ว":d<0?`เลย ${-d} วัน`:`เหลือ ${d} วัน`;
      const ev=evidenceOf(s);
      return `<tr><td class="num">${s.seq}</td>
        <td><button class="linkbtn" data-site="${s.seq}">${esc(s.name)}</button><div style="font-size:12px;color:var(--ink-3)">${esc(s.owner)}</div></td>
        <td>${esc(s.prov)}</td><td class="num">${fdate(s.recv)}</td><td class="num">${fdate(s.due)}</td>
        <td><span class="pill ${timeCls}">${timeTxt}</span></td>
        ${STAGES.map(g=>{const[c,t]=lvlPill(st[g.k]);
          const up=needProof(g.k)&&st[g.k]===1&&!ev[g.k];
          return `<td><span class="pill ${c}${up?" unproven":""}" title="${up?PROOF_TIP:g.n}">${t}</span></td>`;}).join("")}
        <td class="num">${s.kwp}</td><td style="font-size:12px;font-family:ui-monospace,monospace">${esc(s.wbs)}</td></tr>`;}).join("");
  $("#alltbl").innerHTML=`<table><thead><tr><th>#</th><th>การไฟฟ้า / ผู้รับผิดชอบ</th><th>จังหวัด</th><th>รับของ</th><th>ครบกำหนด</th><th>เวลา</th>
    ${STAGES.map(g=>`<th>${g.n}</th>`).join("")}<th>kWp</th><th>WBS</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="12" class="empty">ไม่พบรายการที่ค้นหา</td></tr>`}</tbody></table>`;
  wireSiteLinks("#alltbl");
}
function wireSiteLinks(root){
  $$(root+" [data-site]").forEach(b=>b.onclick=()=>go("site",+b.dataset.site));
}

function wireForm(){
  const f=state.form;
  const fail=(id,msg)=>{const e=$("#e-"+id);if(e){e.textContent=msg;e.hidden=false;}};
  if(f.step===1){
    $("#next1").onclick=()=>{
      f.emp.id=$("#empId").value.trim(); f.emp.name=$("#empName").value.trim(); f.emp.dept=$("#empDept").value.trim();
      $$("#v-report .err").forEach(e=>e.hidden=true);
      let ok=true;
      if(!/^\d{4,10}$/.test(f.emp.id)){fail("empId","กรอกรหัสพนักงานเป็นตัวเลข 4–10 หลัก");ok=false;}
      if(f.emp.name.split(/\s+/).filter(Boolean).length<2){fail("empName","กรอกทั้งชื่อและนามสกุล");ok=false;}
      if(f.emp.dept.length<2){fail("empDept","ระบุสังกัด เช่น กฟส.เมืองลำพูน");ok=false;}
      if(ok){f.step=2;renderReport();}
    };
  }
  if(f.step===2){
    const sync=()=>{f.siteSeq=$("#siteSel").value;f.stage=$("#stageSel").value;f.status=$("#statusSel").value;f.note=$("#note").value;};
    ["siteSel","stageSel","statusSel"].forEach(id=>$("#"+id).onchange=()=>{sync();if(id==="siteSel")renderReport();});
    $("#note").oninput=sync;
    $("#back2").onclick=()=>{sync();f.step=1;renderReport();};
    $("#next2").onclick=()=>{sync();$$("#v-report .err").forEach(e=>e.hidden=true);
      if(!f.siteSeq){fail("site","เลือกสถานที่ติดตั้งก่อน");return;} f.step=3;renderReport();};
  }
  if(f.step===3){
    drawShots();
    $("#geobtn").onclick=askGeo;
    $("#manbtn").onclick=()=>{const b=$("#manbox");b.hidden=!b.hidden;};
    $("#mok").onclick=()=>{
      const la=parseFloat($("#mlat").value),ln=parseFloat($("#mlng").value);
      if(isNaN(la)||isNaN(ln)||la<5||la>21||ln<96||ln>106){alert("พิกัดไม่ถูกต้อง — ละติจูดประมาณ 5–21, ลองจิจูดประมาณ 96–106");return;}
      f.geo={lat:la,lng:ln,acc:0,manual:true};renderReport();};
    $("#pickbtn").onclick=()=>$("#pick").click();
    $("#pick").onchange=e=>addPhotos([...e.target.files]);
    $("#back3").onclick=()=>{f.step=2;renderReport();};
    $("#next3").onclick=()=>{
      $$("#v-report .err").forEach(e=>e.hidden=true);
      if(f.photos.length<2){fail("photo","ต้องแนบรูปถ่ายอย่างน้อย 2 รูป");return;}
      if(!f.geo){fail("photo","ต้องมีพิกัด GPS ก่อน — กดขอพิกัดจากเครื่อง หรือกรอกเอง");return;}
      f.step=4;renderReport();};
    if(!f.geo) askGeo();
  }
  if(f.step===4){
    $("#back4").onclick=()=>{f.step=3;renderReport();};
    $("#send").onclick=submitReport;
  }
}

/* ---------- geolocation ---------- */
function getGeo(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0}),
      ()=>res(null),
      {enableHighAccuracy:true,timeout:15000,maximumAge:20000});
  });
}
async function askGeo(){
  const t=$("#geotxt");
  if(!navigator.geolocation){if(t)t.innerHTML='<span style="color:var(--crit)">เครื่องนี้ไม่รองรับ GPS — กรุณากรอกพิกัดเอง</span>';return null;}
  if(t)t.innerHTML='<span style="color:var(--ink-3)">กำลังอ่านพิกัด…</span>';
  const g=await getGeo();
  if(g){state.form.geo=g;renderReport();return g;}
  if(t)t.innerHTML='<span style="color:var(--crit)">อ่านพิกัดไม่สำเร็จ — เปิด GPS และอนุญาตตำแหน่ง หรือกรอกพิกัดเอง<br>ถ้าเปิดจากลิงก์ในไลน์ ให้เปิดใน Safari/Chrome ก่อน</span>';
  return null;
}

/* ---------- photo: resize + stamp ---------- */
function loadImg(file){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const i=new Image();
    i.onload=()=>res(i);
    i.onerror=()=>rej(new Error("อ่านรูปไม่ได้ ลองถ่ายใหม่หรือเลือกไฟล์อื่น"));
    i.decoding="sync"; i.src=fr.result;};
  fr.onerror=()=>rej(new Error("อ่านไฟล์รูปไม่ได้"));
  fr.readAsDataURL(file);});}

async function stamp(file){
  const img=await loadImg(file);
  const MAX=1440, sc=Math.min(1,MAX/Math.max(img.width,img.height));
  const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const cx=cv.getContext("2d");
  cx.fillStyle="#FFFFFF"; cx.fillRect(0,0,w,h);
  cx.drawImage(img,0,0,w,h);
  const g=state.form.geo, s=SITES.find(x=>String(x.seq)===String(state.form.siteSeq));
  const now=new Date();
  const L=[
    `${s?s.name:""}${s?" · "+s.prov:""}`,
    g?`พิกัด ${g.lat.toFixed(6)}, ${g.lng.toFixed(6)}${g.acc?`  (±${Math.round(g.acc)} ม.)`:""}`:"ไม่มีพิกัด",
    `${fdt(now.getTime())} น. · ผู้แจ้ง ${state.form.emp.name} (${state.form.emp.id})`
  ];
  const fs=Math.max(15,Math.round(w*0.0235)), pad=Math.round(fs*0.7), lh=Math.round(fs*1.42);
  const bh=lh*L.length+pad*2;
  const grd=cx.createLinearGradient(0,h-bh-fs,0,h);
  grd.addColorStop(0,"rgba(8,12,10,0)"); grd.addColorStop(0.3,"rgba(8,12,10,.72)"); grd.addColorStop(1,"rgba(8,12,10,.86)");
  cx.fillStyle=grd; cx.fillRect(0,h-bh-fs,w,bh+fs);
  cx.fillStyle="#E8A33C"; cx.fillRect(pad,h-bh+pad*0.4,Math.round(fs*0.28),bh-pad*1.2);
  cx.textBaseline="top"; cx.fillStyle="#fff";
  L.forEach((line,i)=>{
    cx.font=`${i===0?"600 ":""}${fs}px "IBM Plex Sans Thai", sans-serif`;
    cx.fillStyle=i===0?"#FFFFFF":"rgba(255,255,255,.9)";
    cx.fillText(line,pad*2+fs*0.28,h-bh+pad+i*lh);
  });
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.82));
  return {blob,url:cv.toDataURL("image/jpeg",0.6)};
}

async function addPhotos(files){
  const f=state.form, err=$("#e-photo");
  if(!f.geo){ await askGeo(); }
  if(!f.geo){
    if(err){err.textContent="ยังไม่มีพิกัด — กดขอพิกัดจากเครื่อง หรือกรอกพิกัดเอง ก่อนถ่ายรูป (ระบบต้องปั๊มพิกัดลงบนรูป)";err.hidden=false;}
    return;
  }
  let bad=0;
  for(const file of files){
    if(f.photos.length>=6){break;}
    if(!file.type.startsWith("image/"))continue;
    try{ const {blob,url}=await stamp(file); f.photos.push({blob,url,ts:Date.now()}); }
    catch(e){ bad++; console.warn(e); }
  }
  renderReport();
  if(bad){const e2=$("#e-photo"); if(e2){e2.textContent=`ประมวลผลรูปไม่สำเร็จ ${bad} ไฟล์ — ลองถ่ายใหม่ด้วยกล้องในแอป`;e2.hidden=false;}}
}
function drawShots(){
  const box=$("#shots"); if(!box)return;
  box.innerHTML=state.form.photos.map((p,i)=>`<div class="shot"><img src="${p.url}" alt="รูปที่ ${i+1}">
    <button type="button" data-rm="${i}" aria-label="ลบรูปที่ ${i+1}">×</button></div>`).join("")||"";
  $$("#shots [data-rm]").forEach(b=>b.onclick=()=>{state.form.photos.splice(+b.dataset.rm,1);renderReport();});
}

/* ---------- submit ---------- */
function toJpegData(blob){return new Promise((res,rej)=>{const fr=new FileReader();
  fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error("อ่านไฟล์รูปไม่ได้")); fr.readAsDataURL(blob);});}

async function submitReport(){
  const f=state.form, btn=$("#send"), msg=$("#sendmsg"), err=$("#e-send");
  if(state.online===false){
    err.innerHTML='<b>ยังติดต่อเซิร์ฟเวอร์ไม่ได้</b><br>ตรวจสอบสัญญาณอินเทอร์เน็ต แล้วกดส่งอีกครั้ง — ข้อมูลที่กรอกไว้ยังอยู่';
    err.hidden=false; return;
  }
  btn.disabled=true; err.hidden=true; msg.textContent="กำลังอัปโหลดรูป…";
  try{
    const site=SITES.find(x=>String(x.seq)===String(f.siteSeq));
    const photos=[]; for(const p of f.photos) photos.push(await toJpegData(p.blob));
    msg.textContent="กำลังบันทึกรายงาน…";
    const r=await call("submit",{
      siteSeq:site.seq, siteName:site.name, prov:site.prov,
      stage:f.stage, status:f.status, note:f.note,
      empId:f.emp.id, empName:f.emp.name, empDept:f.emp.dept,
      lat:f.geo.lat, lng:f.geo.lng, acc:f.geo.acc||0, manualGeo:!!f.geo.manual,
      photos, pin:state.pin||""
    });
    if(!r||!r.ok) throw new Error(r&&r.error||"บันทึกไม่สำเร็จ");
    await refresh(true);
    msg.textContent="";
    state.form={step:1,emp:f.emp,siteSeq:"",stage:"main",status:"done",note:"",photos:[],geo:f.geo};
    go("db");
    toast("บันทึกการแจ้งสถานะเรียบร้อย");
  }catch(e){
    err.textContent="บันทึกไม่สำเร็จ: "+(e&&e.message||"ไม่ทราบสาเหตุ")+" — ลองกดส่งใหม่อีกครั้ง";
    err.hidden=false; msg.textContent="";
  }
  btn.disabled=false;
}
function toast(t){
  const d=document.createElement("div");
  d.textContent=t; d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:99;background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25)";
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}

    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div><label class="f" for="dId">รหัสพนักงานผู้ทำรายการ <span>*</span></label><input class="in num" id="dId" inputmode="numeric"></div>
      <div><label class="f" for="dName">ชื่อ - นามสกุล <span>*</span></label><input class="in" id="dName"></div>
    </div>
    <div style="margin-top:12px"><label class="f" for="dDept">สังกัด</label><input class="in" id="dDept" list="units"></div>
    <div style="margin-top:12px"><label class="f" for="dWhy">เหตุผล <span>*</span></label>
      <textarea class="in" id="dWhy" rows="2" placeholder="${del?"เช่น แจ้งซ้ำกับรายการเวลา 09:12 / แนบรูปผิดสถานที่":"เช่น ลบผิดรายการ"}"></textarea>
      <div class="hint">อย่างน้อย 10 ตัวอักษร</div></div>
    <div class="err" id="dErr" hidden></div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="dCancel" type="button">ยกเลิก</button>

  </div>`;

  $("#dCancel",m).onclick=()=>m.remove();

    }catch(ex){
      err.textContent="ทำรายการไม่สำเร็จ: "+(ex&&ex.message||"ไม่ทราบสาเหตุ");
      err.hidden=false; $("#dOk",m).disabled=false;
    }
  };
}

/* =======================================================================  SITE DETAIL  */
function renderSite(){
  const s=SITES.find(x=>x.seq===state.siteSel);
  if(!s){$("#v-site").innerHTML=`<div class="empty">ไม่พบสถานที่</div>`;return;}
  const st=siteStatus(s), d=daysTo(s.due);
  const rs=state.reports.filter(r=>r.siteSeq===s.seq).sort((a,b)=>b.ts-a.ts);
  const timeCls=st.main===1?"p-ok":d<0?"p-crit":d<=7?"p-warn":"p-idle";

        <div><div class="k">ขนาดติดตั้ง</div><b class="num">${s.kwp} kWp · ${s.pv} แผง</b></div>

        <div style="grid-column:span 2"><div class="k">หมายเลข WBS</div><b style="font-family:ui-monospace,monospace;font-size:12.5px">${esc(s.wbs)}</b></div>

          return `<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2)">
            <span style="font-size:13.5px">${g.n}</span>

function openBig(src){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="box"><img src="${src}" alt="รูปการติดตั้งขนาดเต็ม" style="width:100%;border-radius:8px">
    <div style="margin-top:12px;text-align:right"><button class="btn" type="button">ปิด</button></div></div>`;
  m.onclick=e=>{if(e.target===m||e.target.tagName==="BUTTON")m.remove();};
  document.body.appendChild(m);
}

function saveFile(filename,data){
  const blob=(data instanceof Blob)?data:new Blob([data],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  toast("กำลังดาวน์โหลดไฟล์");
}
function exportCSV(){
  const csv="﻿"+[REP_HEAD,...repRows()].map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  saveFile("solar-n1-reports.csv",csv);
}

/* =======================================================================  SCHEDULE SHEET (A4 แนวนอน)  */
const D=iso=>new Date(iso+"T00:00:00");
function renderSchedSheet(){
  const rows=SITES.map(s=>({s,st:siteStatus(s),left:daysTo(s.due)}));
  const ax0=new Date(Math.min(...SITES.map(s=>+D(s.recv))))-86400000;
  const ax1=new Date(Math.max(...SITES.map(s=>+D(s.due))))+2*86400000;
  const span=(ax1-ax0)/86400000;
  const pc=d=>((+d-ax0)/86400000)/span*100;
  const cls=r=> r.st.main===1?"ok" : r.left<0?"crit" : r.left<=7?"warn" : "plan";
  const stx=r=> r.st.main===1?"ติดตั้งแล้วเสร็จ" : r.left<0?`เลยกำหนด ${-r.left} วัน`
                : r.left===0?"ครบกำหนดวันนี้" : `เหลือ ${r.left} วัน`;
  const ticks=[]; for(let t=ax0;t<=ax1;t+=7*86400000) ticks.push(new Date(t));
  const axis=ticks.map(t=>`<span style="left:${pc(t).toFixed(3)}%">${t.getDate()} ${THM[t.getMonth()]}</span>
    <i style="left:${pc(t).toFixed(3)}%"></i>`).join("");
  const nowPc=pc(today());

  let prev=null;
  const body=rows.map(r=>{
    const band=(prev!==null&&r.s.due!==prev)?" band":""; prev=r.s.due;
    const ev=evidenceOf(r.s);
    const mk=k=>r.st[k]!==1?"–":(!needProof(k)||ev[k]?"✓":'<span title="ยังไม่มีรูปถ่ายยืนยันในระบบ">✓*</span>');
    const L=pc(D(r.s.recv)), W=pc(D(r.s.due))-L, c=cls(r);
    return `<tr class="${band.trim()}">
      <td class="n">${r.s.seq}</td>

      <td class="n">${r.s.kwp}</td>
      <td class="gcell"><div class="track">
        <div class="gbar ${c}" style="left:${L.toFixed(3)}%;width:${Math.max(W,0.5).toFixed(3)}%"></div>
        <div class="gd r" style="left:${L.toFixed(3)}%"></div>
        <div class="gd d ${c}" style="left:${pc(D(r.s.due)).toFixed(3)}%"></div>
        <div class="gnow" style="left:${nowPc.toFixed(3)}%"></div></div></td>

      <td class="lst">${esc(g.map(r=>r.s.name).join(" · "))}</td></tr>`;}).join("");

      <div><h2>สรุประยะเวลากำหนดการติดตั้ง Solar Rooftop ระยะที่ 4 — กฟน.1 (36 แห่ง)</h2>
        <div class="sub">สัญญาเลขที่ บ.45/2569 ลงวันที่ 9 ก.ค. 2026 · เกณฑ์: ติดตั้งให้แล้วเสร็จภายใน 1 เดือนนับจากวันที่รับของ · ข้อมูล ณ ${fdt(Date.now())}</div></div>
      <div class="kpis">

        <div class="kpi"><div class="k">รวมกำลังผลิต</div><div class="v">344</div></div>
      </div>
    </div>
    <table>

const SW=560;
function chartStages(rows){
  const H=STAGES.length*42+14, bw=26;
  let out=`<svg class="chart" viewBox="0 0 ${SW} ${H}" role="img" aria-label="ความคืบหน้าแต่ละขั้นตอน">`;
  const x0=178, w=SW-x0-46;
  [0,.25,.5,.75,1].forEach(t=>{out+=`<line class="gridline" x1="${x0+w*t}" y1="6" x2="${x0+w*t}" y2="${H-24}"/>`;});
  STAGES.forEach((g,i)=>{
    const y=12+i*42, d=rows.filter(r=>r.st[g.k]===1).length, p=rows.filter(r=>r.st[g.k]===0.5).length;
    const dw=w*d/36, pw=w*p/36;
    out+=`<text class="axis" x="${x0-10}" y="${y+bw/2+4}" text-anchor="end">${g.n.length>20?g.n.slice(0,19)+"…":g.n}</text>`;
    out+=`<rect x="${x0}" y="${y}" width="${w}" height="${bw}" rx="4" fill="var(--line-2)"/>`;
    if(pw>2)out+=`<rect x="${x0+dw+2}" y="${y}" width="${Math.max(0,pw-2)}" height="${bw}" rx="4" fill="${g.c}" opacity=".35"
      data-tip="${g.n}: กำลังดำเนินการ ${p} แห่ง"/>`;
    if(dw>0)out+=`<rect x="${x0}" y="${y}" width="${dw}" height="${bw}" rx="4" fill="${g.c}" data-tip="${g.n}: แล้วเสร็จ ${d} จาก 36 แห่ง"/>`;
    out+=`<text class="vlab" x="${x0+Math.max(dw,0)+8}" y="${y+bw/2+4}">${d}</text>`;
  });
  [0,9,18,27,36].forEach(v=>{out+=`<text class="axis" x="${x0+w*v/36}" y="${H-8}" text-anchor="middle">${v}</text>`;});
  return out+`</svg><div class="legend">${STAGES.map(g=>`<span><i style="background:${g.c}"></i>${g.n}</span>`).join("")}</div>`;
}
function chartProv(rows){
  const provs=[...new Set(SITES.map(s=>s.prov))]
    .map(p=>({p,tot:rows.filter(r=>r.s.prov===p).length,done:rows.filter(r=>r.s.prov===p&&r.st.main===1).length}))
    .sort((a,b)=>b.tot-a.tot);
  const H=provs.length*36+16, x0=96, w=SW-x0-46, mx=Math.max(...provs.map(p=>p.tot));
  let out=`<svg class="chart" viewBox="0 0 ${SW} ${H}" role="img" aria-label="ติดตั้งแล้วเสร็จแยกตามจังหวัด">`;
  provs.forEach((p,i)=>{
    const y=10+i*36, bw=24, tw=w*p.tot/mx, dw=w*p.done/mx;
    out+=`<text class="axis" x="${x0-10}" y="${y+bw/2+4}" text-anchor="end">${p.p}</text>`;
    out+=`<rect x="${x0}" y="${y}" width="${tw}" height="${bw}" rx="4" fill="var(--c1)" opacity=".22" data-tip="${p.p}: ตามแผน ${p.tot} แห่ง"/>`;
    if(dw>0)out+=`<rect x="${x0}" y="${y}" width="${dw}" height="${bw}" rx="4" fill="var(--c1)" data-tip="${p.p}: ติดตั้งแล้ว ${p.done} จาก ${p.tot} แห่ง"/>`;
    out+=`<text class="vlab" x="${x0+tw+8}" y="${y+bw/2+4}">${p.done}/${p.tot}</text>`;
  });
  return out+`</svg><div class="legend"><span><i style="background:var(--c1)"></i>ติดตั้งหลักแล้วเสร็จ</span>
    <span><i style="background:var(--c1);opacity:.22"></i>ตามแผนทั้งหมด</span></div>`;
}
function chartDue(rows){
  const map={};
  rows.forEach(r=>{(map[r.s.due]=map[r.s.due]||{tot:0,done:0}).tot++; if(r.st.main===1)map[r.s.due].done++;});
  const ks=Object.keys(map).sort(), H=200, x0=34, y0=H-40, w=SW-x0-16, mx=Math.max(...ks.map(k=>map[k].tot));
  const bw=Math.min(46,w/ks.length-12), step=w/ks.length;
  let out=`<svg class="chart" viewBox="0 0 ${SW} ${H}" role="img" aria-label="จำนวนแห่งตามวันครบกำหนด">`;
  for(let v=0;v<=mx;v+=Math.ceil(mx/4)){const y=y0-(y0-16)*v/mx;
    out+=`<line class="gridline" x1="${x0}" y1="${y}" x2="${SW-12}" y2="${y}"/><text class="axis" x="${x0-8}" y="${y+4}" text-anchor="end">${v}</text>`;}
  ks.forEach((k,i)=>{
    const c=map[k], x=x0+step*i+(step-bw)/2;
    const th=(y0-16)*c.tot/mx, dh=(y0-16)*c.done/mx, past=daysTo(k)<0;
    out+=`<rect x="${x}" y="${y0-th}" width="${bw}" height="${th}" rx="4" fill="${past?"var(--crit)":"var(--c2)"}" opacity=".22"
      data-tip="${fdate(k)}: ครบกำหนด ${c.tot} แห่ง"/>`;
    if(dh>0)out+=`<rect x="${x}" y="${y0-dh}" width="${bw}" height="${dh}" rx="4" fill="var(--ok)" data-tip="${fdate(k)}: ติดตั้งแล้ว ${c.done} แห่ง"/>`;
    out+=`<text class="vlab" x="${x+bw/2}" y="${y0-th-7}" text-anchor="middle">${c.tot}</text>`;
    out+=`<text class="axis" x="${x+bw/2}" y="${y0+15}" text-anchor="middle">${new Date(k+"T00:00:00").getDate()} ${THM[new Date(k+"T00:00:00").getMonth()]}</text>`;
  });
  const t=today(); let tx=null;
  ks.forEach((k,i)=>{ if(new Date(k+"T00:00:00")<=t) tx=x0+step*(i+1); });
  if(tx!==null&&tx<SW-14) out+=`<line x1="${tx}" y1="10" x2="${tx}" y2="${y0}" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="axis" x="${tx+5}" y="18">วันนี้</text>`;
  out+=`<line x1="${x0}" y1="${y0}" x2="${SW-12}" y2="${y0}" stroke="var(--line)" stroke-width="1"/>`;
  return out+`</svg><div class="legend"><span><i style="background:var(--ok)"></i>ติดตั้งแล้ว</span>
    <span><i style="background:var(--c2);opacity:.3"></i>ครบกำหนดข้างหน้า</span>
    <span><i style="background:var(--crit);opacity:.3"></i>เลยกำหนดแล้ว</span></div>`;
}
function chartBudget(rows){
  const tot=SITES.reduce((a,s)=>a+s.budget,0);
  const done=rows.filter(r=>r.st.main===1).reduce((a,r)=>a+r.s.budget,0);
  const pct=done/tot;
  return `<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
      <div class="disp num" style="font-size:30px;font-weight:600;letter-spacing:-.5px">${nf(done)}</div>
      <div style="color:var(--ink-3);font-size:13px">บาท · ${(pct*100).toFixed(1)}% ของวงเงิน</div></div>
    <svg class="chart" viewBox="0 0 ${SW} 46" role="img" aria-label="สัดส่วนมูลค่างานที่ติดตั้งแล้ว">
      <rect x="0" y="6" width="${SW}" height="26" rx="6" fill="var(--line-2)"/>
      <rect x="0" y="6" width="${Math.max(2,SW*pct)}" height="26" rx="6" fill="var(--c3)" data-tip="ติดตั้งแล้ว ${nf(done)} บาท"/>
      <text class="axis" x="0" y="44">0</text><text class="axis" x="${SW}" y="44" text-anchor="end">${nf(tot)} บาท</text>
    </svg>
    <div class="legend"><span><i style="background:var(--c3)"></i>มูลค่าที่ติดตั้งแล้ว ${nf(done)} บาท</span>
      <span><i style="background:var(--line-2)"></i>คงเหลือ ${nf(tot-done)} บาท</span></div>`;
}
function chartDaily(){
  const days=[]; const t=today();
  for(let i=13;i>=0;i--){const d=new Date(t);d.setDate(d.getDate()-i);days.push(d);}
  const cnt=days.map(d=>live().filter(r=>{const x=new Date(r.ts);return x.toDateString()===d.toDateString();}).length);
  const mx=Math.max(1,...cnt), H=170, x0=28, y0=H-34, w=SW-x0-14, step=w/days.length, bw=Math.min(26,step-8);
  let out=`<svg class="chart" viewBox="0 0 ${SW} ${H}" role="img" aria-label="จำนวนรายงานรายวัน">`;
  [0,mx].forEach(v=>{const y=y0-(y0-14)*v/mx;
    out+=`<line class="gridline" x1="${x0}" y1="${y}" x2="${SW-8}" y2="${y}"/><text class="axis" x="${x0-6}" y="${y+4}" text-anchor="end">${v}</text>`;});
  days.forEach((d,i)=>{
    const h=(y0-14)*cnt[i]/mx, x=x0+step*i+(step-bw)/2;
    out+=`<rect x="${x}" y="${y0-Math.max(h,1.5)}" width="${bw}" height="${Math.max(h,1.5)}" rx="4"
      fill="${cnt[i]?"var(--c4)":"var(--line-2)"}" data-tip="${d.getDate()} ${THM[d.getMonth()]}: ${cnt[i]} รายงาน"/>`;
    if(i%3===0||i===days.length-1)out+=`<text class="axis" x="${x+bw/2}" y="${y0+15}" text-anchor="middle">${d.getDate()}</text>`;
  });
  out+=`<line x1="${x0}" y1="${y0}" x2="${SW-8}" y2="${y0}" stroke="var(--line)" stroke-width="1"/>`;
  return out+`</svg><div class="legend"><span><i style="background:var(--c4)"></i>รายงานจากหน้างาน · รวม ${live().length} รายการ</span></div>`;
}
function wireTips(){
  let tip=$("#tip");
  $$("#v-analytics [data-tip]").forEach(el=>{
    el.style.cursor="default";
    el.addEventListener("pointerenter",e=>{
      if(!tip){tip=document.createElement("div");tip.id="tip";document.body.appendChild(tip);}
      tip.textContent=el.dataset.tip; tip.hidden=false;
      tip.style.left=Math.min(window.innerWidth-240,e.clientX+12)+"px"; tip.style.top=(e.clientY-8)+"px";
    });
    el.addEventListener("pointermove",e=>{if(tip){tip.style.left=Math.min(window.innerWidth-240,e.clientX+12)+"px";tip.style.top=(e.clientY-8)+"px";}});
    el.addEventListener("pointerleave",()=>{if(tip)tip.hidden=true;});
  });
}

/* ---------- ปุ่มปรับขนาดตัวหนังสือ ---------- */
function applyFs(v){
  v=Math.min(1.6,Math.max(0.85,Math.round(v*100)/100));
  document.documentElement.style.setProperty("--fs",v);
  const t=$("#fsval"); if(t)t.textContent=Math.round(v*100)+"%";
  try{localStorage.setItem("solarFs",v);}catch(e){}
  return v;
}
let FS=1;
try{ const v=parseFloat(localStorage.getItem("solarFs")); if(v) FS=v; }catch(e){}
applyFs(FS);
$("#fsup").onclick=()=>{FS=applyFs(FS+0.1);};
$("#fsdn").onclick=()=>{FS=applyFs(FS-0.1);};

$("#refreshbtn").onclick=()=>refresh();
$("#themebtn").onclick=()=>{
  const r=document.documentElement;
  const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
};

/* ---------- ชั้นเชื่อมต่อ Google Apps Script ---------- */
/* ====================================================================
   ★ แก้บรรทัดล่างนี้บรรทัดเดียว: วาง URL ที่ลงท้ายด้วย /exec ของ Apps Script
   ==================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbziF_jfB4zqU8jojsTVwu_dQvlvDxhxJA0bwB7C92-1yFgElrFyDy6upNDaExLWWb-1/exec";

const hasGAS=()=>typeof google!=="undefined"&&google.script&&google.script.run;
function call(action,payload){
  if(hasGAS()){
    const fn={submit:"apiSubmit",delete:"apiDelete",list:"apiList"}[action];
    return new Promise((res,rej)=>{
      const r=google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message||"เรียกเซิร์ฟเวอร์ไม่สำเร็จ")));
      action==="list"?r[fn]():r[fn](payload);
    });
  }
  if(!API_URL) return Promise.reject(new Error("ยังไม่ได้ตั้งค่า API_URL"));
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action,payload})}).then(r=>r.json());
}
async function refresh(quiet){
  const st=$("#dbstate");
  if(!quiet&&st)st.textContent="กำลังโหลดข้อมูล…";
  try{
    const r=await call("list");
    if(!r||!r.ok) throw new Error(r&&r.error||"อ่านข้อมูลไม่สำเร็จ");
    state.reports=(r.reports||[]).map(x=>({...x,ts:Number(x.ts)||0,siteSeq:Number(x.siteSeq),
      lat:Number(x.lat),lng:Number(x.lng),delTs:Number(x.delTs)||0}));
    state.audit=(r.audit||[]).map(x=>({...x,ts:Number(x.ts)||0,origTs:Number(x.origTs)||0}));
    state.online=true;
    if(st)st.textContent="เชื่อมต่อแล้ว · อัปเดต "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    state.online=false;
    if(st)st.textContent="เชื่อมต่อไม่ได้ — "+(e.message||"");
  }
  render();
}
if(!API_URL||API_URL.indexOf("script.google.com")<0){
  window.__BOOTLOG.push("ยังไม่ได้ตั้งค่า API_URL — เปิดไฟล์ index.html แล้ววาง URL /exec ของ Apps Script");
  __showBoot();
}else{
  refresh();
  setInterval(()=>refresh(true),60000);
}
window.__APP_OK=true;
